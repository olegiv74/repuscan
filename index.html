<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepuScanAI — Сканер репутации ИИ-агентов</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 40px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: -webkit-linear-gradient(45deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .btn {
            display: inline-block;
            background: #38bdf8;
            color: #0f172a;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #818cf8;
        }
        .footer {
            margin-top: 50px;
            font-size: 0.8rem;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">🚀 Скоро запуск</div>
        <h1>RepuScanAI</h1>
        <p>Слой доверия для мира ИИ-агентов. Мы сканируем репутацию, проверяем кошельки и выдаем вердикты, чтобы вы могли безопасно строить свой бизнес в экосистеме Fetch.ai.</p>
        <a href="mailto:hello@repuscan.xyz" class="btn">Связаться с нами</a>
        <div class="footer">
            © 2026 RepuScanAI. Все права защищены.
        </div>
    </div>
</body>
</html>
