<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepuScanAI — AI Agent Reputation Scanner</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            /* Красивый технологичный фон из точек */
            background-image: radial-gradient(#334155 1px, transparent 1px);
            background-size: 30px 30px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 700px;
            padding: 40px;
            width: 100%;
            box-sizing: border-box;
            background: rgba(15, 23, 42, 0.8); /* Легкая подложка, чтобы фон не мешал читать текст */
            backdrop-filter: blur(5px);
            border-radius: 24px;
            border: 1px solid #1e293b;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }
        .logo-svg {
            width: 70px;
            height: 70px;
            margin-right: 15px;
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.5));
        }
        .logo-text {
            font-size: 3.5rem;
            font-weight: bold;
            background: -webkit-linear-gradient(45deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }
        .subtitle {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 40px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            position: relative;
        }
        input[type="text"] {
            flex: 1;
            padding: 18px 25px;
            font-size: 1.1rem;
            border-radius: 50px;
            border: 2px solid #334155;
            background: #1e293b;
            color: white;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        
        /* Анимация сканирования */
        .scan-line {
            position: absolute;
            top: 2px;
            bottom: 2px;
            left: 2px;
            width: 0;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.3), #38bdf8, rgba(56, 189, 248, 0.3), transparent);
            border-radius: 50px;
            pointer-events: none;
            opacity: 0;
        }
        .scanning .scan-line {
            animation: scan 1.5s infinite linear;
            opacity: 1;
        }
        @keyframes scan {
            0% { left: 0; width: 0; opacity: 0; }
            10% { opacity: 1; }
            50% { left: 0; width: 50%; }
            90% { opacity: 1; }
            100% { left: 100%; width: 0; opacity: 0; }
        }

        button {
            padding: 18px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            border: none;
            background: #38bdf8;
            color: #0f172a;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            z-index: 1;
        }
        button:hover {
            background: #818cf8;
        }
        button:active {
            transform: scale(0.98);
        }
        .result-card {
            background: #1e293b;
            border-radius: 16px;
            padding: 30px;
            margin-top: 30px;
            text-align: left;
            border: 1px solid #334155;
            display: none;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        .status-clean { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
        .status-suspicious { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid #eab308; }
        .status-highrisk { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #334155;
            color: #cbd5e1;
        }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #94a3b8; }
        .footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <!-- Стильная SVG-иконка (щит со сканером) -->
            <svg class="logo-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 22C12 22 20 18 20 12V5L12 2L4 5V12C4 18 12 22 12 22Z" stroke="url(#paint0_linear)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M8 12L11 15L16 9" stroke="url(#paint0_linear)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <defs>
                    <linearGradient id="paint0_linear" x1="4" y1="2" x2="20" y2="22" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#38bdf8"/>
                        <stop offset="1" stop-color="#818cf8"/>
                    </linearGradient>
                </defs>
            </svg>
            <div class="logo-text">RepuScanAI</div>
        </div>
        
        <div class="subtitle">Trust Layer for the AI Agent Ecosystem</div>
        
        <div class="search-box" id="searchBox">
            <input type="text" id="agentInput" placeholder="Enter agent address (agent1q...)">
            <div class="scan-line"></div>
            <button onclick="checkAgent()">Check</button>
        </div>

        <div id="resultCard" class="result-card">
            <div id="statusBadge" class="status-badge"></div>
            <h3 style="margin-top: 0; color: #e2e8f0;">Scan Result</h3>
            <div class="info-row">
                <span class="info-label">Agent Address:</span>
                <span id="resAddress" style="word-break: break-all; max-width: 60%; text-align: right;">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Wallet Status:</span>
                <span id="resWallet">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Scan Date:</span>
                <span id="resDate">-</span>
            </div>
        </div>

        <div class="footer">
            © 2026 RepuScanAI. All rights reserved.
        </div>
    </div>

    <script>
        function checkAgent() {
            const input = document.getElementById('agentInput').value.trim();
            const resultCard = document.getElementById('resultCard');
            const searchBox = document.getElementById('searchBox');
            
            if (!input) {
                alert("Please enter an agent address.");
                return;
            }

            // Включаем анимацию сканирования
            searchBox.classList.add('scanning');
            resultCard.style.display = 'none'; // Скрываем старый результат

            setTimeout(() => {
                // Останавливаем анимацию
                searchBox.classList.remove('scanning');
                
                // Показываем результат
                resultCard.style.display = 'block';
                document.getElementById('resAddress').innerText = input;
                
                const badge = document.getElementById('statusBadge');
                badge.className = 'status-badge';
                
                // Имитация случайного статуса
                const statuses = [
                    { text: "Safe (Clean)", class: "status-clean", color: "#4ade80" },
                    { text: "Suspicious", class: "status-suspicious", color: "#facc15" },
                    { text: "High Risk", class: "status-highrisk", color: "#f87171" }
                ];
                const randomStatus = statuses[Math.floor(Math.random() * statuses.length)];

                badge.innerText = randomStatus.text;
                badge.className = `status-badge ${randomStatus.class}`;
                
                document.getElementById('resWallet').innerText = randomStatus.text.split(' ')[0];
                document.getElementById('resWallet').style.color = randomStatus.color;
                
                const now = new Date();
                document.getElementById('resDate').innerText = now.toLocaleString('en-US');
            }, 2000); // 2 секунды на анимацию
        }
    </script>
</body>
</html>
