<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepuScanAI — Developer Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background-color: #0f172a; background-image: radial-gradient(#334155 1px, transparent 1px); background-size: 30px 30px; color: #ffffff; min-height: 100vh; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: rgba(15, 23, 42, 0.9); border-bottom: 1px solid #1e293b; }
        .nav-logo { font-size: 1.5rem; font-weight: bold; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
        .container { max-width: 1000px; margin: 40px auto; padding: 20px; }
        .card { background: #1e293b; border-radius: 16px; padding: 30px; border: 1px solid #334155; margin-bottom: 20px; }
        h2 { color: #38bdf8; margin-top: 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .pricing-card { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 20px; text-align: center; }
        .pricing-card h3 { color: #e2e8f0; }
        .pricing-card .price { font-size: 2rem; color: #38bdf8; font-weight: bold; margin: 10px 0; }
        .btn { padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; font-size: 1rem; }
        .btn-primary { background: #38bdf8; color: #0f172a; }
        .btn-secondary { background: transparent; color: #38bdf8; border: 1px solid #38bdf8; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 22C12 22 20 18 20 12V5L12 2L4 5V12C4 18 12 22 12 22Z" stroke="#38bdf8" stroke-width="2"/>
            </svg>
            RepuScanAI
        </div>
        <div id="navStatus" style="font-size: 0.9rem; color: #94a3b8;">Not Logged In</div>
    </nav>

    <div class="container">
        <!-- Форма регистрации -->
        <div id="registerForm" class="card">
            <h2>Developer Registration</h2>
            <p style="color: #94a3b8;">Register your agent to access the Developer Dashboard.</p>
            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; color:#cbd5e1;">Agent Address</label>
                <input type="text" id="regAgent" style="width:100%; padding:12px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:white;" placeholder="agent1q...">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; color:#cbd5e1;">Email</label>
                <input type="email" id="regEmail" style="width:100%; padding:12px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:white;" placeholder="you@example.com">
            </div>
            <button class="btn btn-primary" onclick="register()">Register & Go to Dashboard</button>
        </div>

        <!-- Личный кабинет -->
        <div id="dashboard" class="hidden">
            <div class="card">
                <h2>Welcome, <span id="userEmail"></span>!</h2>
                <p style="color: #94a3b8;">Your Agent: <code id="userAgent" style="color: #38bdf8;"></code></p>
            </div>

            <div class="grid">
                <!-- Карточка 1: Верификация -->
                <div class="pricing-card">
                    <h3>Verification Badge</h3>
                    <p style="color: #94a3b8; font-size: 0.9rem;">Get the green checkmark to earn trust.</p>
                    <div class="price">10 FET</div>
                    <button class="btn btn-primary" onclick="buyService('verification')">Buy Verification</button>
                </div>
                <!-- Карточка 2: API Доступ -->
                <div class="pricing-card">
                    <h3>API Access</h3>
                    <p style="color: #94a3b8; font-size: 0.9rem;">Connect your agent to our API for auto-checks.</p>
                    <div class="price">50 FET / mo</div>
                    <button class="btn btn-secondary" onclick="buyService('api')">Get API Key</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Простая логика переключения экранов (без реального логина)
        function register() {
            const agent = document.getElementById('regAgent').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            if (!agent || !email) { alert("Please fill all fields."); return; }

            // Отправляем на сервер (опционально)
            fetch('https://tally-assertive-peafowl.cloudpub.ru/register', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ agent_address: agent, email: email })
            }).catch(() => {});

            // Показываем кабинет
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('userEmail').innerText = email;
            document.getElementById('userAgent').innerText = agent;
            document.getElementById('navStatus').innerText = "Logged In";
        }

        function buyService(type) {
            if (type === 'verification') {
                alert("Please send 10 FET to: fetch10mdaxxzwgxxqf0qctqk4u8v3q99wg9tsfy7jt8\n\nAfter payment, we will verify your agent.");
            } else {
                alert("API Access costs 50 FET/month. Please contact us to set up your API key.");
            }
        }
    </script>
</body>
</html>
